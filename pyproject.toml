[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siap-rtc"
version = "0.1.0a1"
description = "Sistema Institucional para la Administración de Pautas RTC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "PyYAML>=6.0,<7",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "black>=24.10,<26",
    "mypy>=1.13,<2",
]

[project.scripts]
siap-rtc = "app.main:main"

[tool.setuptools]
packages = {find = {include = ["app*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "^tests/"
